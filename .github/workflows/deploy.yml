# Build the Astro site and deploy it to GitHub Pages.
#
# One-time setup (do this BEFORE merging the PR that adds this file):
#   Repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# While the source is still "Deploy from a branch", Pages would serve the raw Astro source from
# the main branch root instead of the built site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
